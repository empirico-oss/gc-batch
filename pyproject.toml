
[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.8.2,<0.15.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[project]
name = "gc-batch"
dynamic = ["version"]
description = "Command-line interface and Python client for managing Google Cloud Batch jobs"
readme = "README.md"
requires-python = ">=3.10.0"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Empirico Inc." }]
keywords = ["google-cloud", "google-cloud-batch", "gcp", "batch", "cli", "bioinformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.2.1",
    "google-cloud-batch>=0.17.36",
    "google-cloud-logging>=3.12.1",
    "google-cloud-storage>=3.2.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.7.0",
]

[project.urls]
Homepage = "https://github.com/empirico-oss/gc-batch"
Documentation = "https://empirico-oss.github.io/gc-batch/stable/"
Repository = "https://github.com/empirico-oss/gc-batch"
Issues = "https://github.com/empirico-oss/gc-batch/issues"
Changelog = "https://github.com/empirico-oss/gc-batch/blob/main/CHANGELOG.md"

[tool.uv]
package = true

[project.scripts]
gc-batch = "gc_batch.entrypoint:cli"

[dependency-groups]
dev = ["mypy>=1.14.0", "pytest>=9.0.3", "ruff>=0.9.0"]
docs = [
    "mike>=2.1.3",
    "mkapi>=4.4.1",
    "mkdocs-api-autonav>=0.3.0",
    "mkdocs-macros-plugin>=1.3.7",
    "mkdocs-material>=9.7.7",
    "mkdocs>=1.6.1",
    # 2.20.0 is the first release with the GUID-regex ReDoS fix
    # (GHSA-5239-wwwm-4pmq). The HtmlFormatter regression that previously
    # capped us below 2.20 was fixed upstream in pygments/pygments#3076.
    "pygments>=2.20.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501: `ruff format` governs line length; the rule only fights it over long
#   docstrings, URLs, and CLI help strings that cannot be wrapped meaningfully.
# SIM108: the remaining if/else blocks carry explanatory comments that collapsing
#   them into ternaries would discard.
ignore = ["E501", "SIM108"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/gc_batch"]

[tool.hatch.build.targets.sdist]
include = ["src/gc_batch", "tests", "CHANGELOG.md", "CONTRIBUTING.md"]

[tool.hatch.build.hooks.version]
path = "./src/gc_batch/_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build.force-include]
"src/gc_batch/_version.py" = "src/gc_batch/_version.py"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
dirty = true
tag-branch = "remotes/origin/main"
fallback-version = "0.0.0"
format-jinja = """
    {%- set isdirty = "dirty" if dirty else None -%}
    {%- set meta = [branch_escaped,commit,isdirty] | reject("none") | list -%}
    {%- if distance == 0 -%}
        {{ serialize_pep440(base, stage, revision) }}
    {%- elif revision is not none -%}
        {{ serialize_pep440(base, stage, revision + 1, dev=distance, metadata=meta) }}
    {%- elif branch in ("master", "main") -%}
        {{ serialize_pep440(base, "rc", distance, metadata=([isdirty]|reject("none")|list) ) }}
    {%- else -%}
        {{ serialize_pep440(bump_version(base), stage, revision, dev=distance, metadata=meta) }}
    {%- endif -%}
"""
